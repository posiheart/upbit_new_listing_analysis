[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upbit-new-listing-analysis"
version = "0.1.0"
description = "Reproducible Upbit KRW listing return analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
listing-analysis = "listing_analysis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

